name: AIOS CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Clippy linting
        run: cargo clippy --all -- -D warnings

      - name: Build workspace
        run: cargo build --all --verbose

      - name: Run tests
        run: cargo test --all --verbose

      - name: Test CLIs
        run: |
          cargo run --bin ai -- --help
          cargo run --bin edge -- --help
          cargo run --bin aios-deploy -- help
          cargo run --bin aios-security -- help
          cargo run --bin aios-dev -- help

  boot-test-x86_64:
    name: QEMU Boot Test (x86_64)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The upstream Redox tree is ~1 GB and is deliberately not vendored, so
      # a clean checkout cannot build an image. bootstrap.sh fetches exactly
      # the revision pinned in platform/upstream.lock.
      - name: Read the pinned upstream revision
        id: pin
        run: |
          sha=$(sed -n 's/^commit = "\([0-9a-f]\{40\}\)"/\1/p' platform/upstream.lock | head -1)
          if [ -z "$sha" ]; then
            echo "::error::could not read commit from platform/upstream.lock"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Report runner capacity
        run: df -h / "$HOME" | sed -n '1,4p'

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          # Ubuntu names these qemu-system-x86 / qemu-system-arm. The
          # qemu-system-x86_64 and qemu-system-aarch64 names are Debian's and
          # do not resolve here, which is why this step used to fail.
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Cache the pinned Redox upstream
        uses: actions/cache@v4
        with:
          path: redox-os
          key: redox-upstream-${{ steps.pin.outputs.sha }}

      - name: Fetch the pinned upstream
        run: ./platform/scripts/bootstrap.sh

      # The native build (-n) needs cbindgen/nasm/just on the host, which the
      # podman path would have supplied from the redox-base container.
      - name: Install native build host dependencies
        run: ./platform/scripts/host-deps.sh

      # -n forces the native build. The podman path is auto-detected on these
      # runners (podman is preinstalled) but is unvalidated for our profiles:
      # they include upstream's config/server.toml by a relative path that
      # escapes the container's mount. See docs/gotchas/podman-build-unvalidated.md.
      - name: Build x86_64 ai-developer image
        run: ./platform/scripts/build.sh -a x86_64 -c ai-developer -n

      - name: Run x86_64 boot test
        run: ./platform/scripts/test.sh -a x86_64 -c ai-developer -t 300

      # Same reasoning as the aarch64 stability step: the boot canary runs
      # `ls`/`cat` once each, and this image intermittently faults them too
      # (9/10 measured on an unpatched x86_64 image). Kept as a reported,
      # non-blocking signal for the same reason.
      - name: Run x86_64 stability test (reported, non-blocking)
        continue-on-error: true
        run: |
          ./platform/scripts/test-stability.sh -a x86_64 -c ai-developer \
            -n 10 -t 500

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-boot-log
          # if-no-files-found: warn -- a build that dies before the boot test
          # leaves no log, and that should not itself be a hard error.
          if-no-files-found: warn
          path: /tmp/aios-*.log

  boot-test-aarch64:
    name: QEMU Boot Test (aarch64, kernel canary)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned upstream revision
        id: pin
        run: |
          sha=$(sed -n 's/^commit = "\([0-9a-f]\{40\}\)"/\1/p' platform/upstream.lock | head -1)
          if [ -z "$sha" ]; then
            echo "::error::could not read commit from platform/upstream.lock"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Report runner capacity
        run: df -h / "$HOME" | sed -n '1,4p'

      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update
          # Ubuntu names these qemu-system-arm / qemu-efi-aarch64; the
          # qemu-system-aarch64 name is Debian's and does not resolve here.
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64

      - name: Cache the pinned Redox upstream
        uses: actions/cache@v4
        with:
          path: redox-os
          key: redox-upstream-${{ steps.pin.outputs.sha }}

      - name: Fetch the pinned upstream
        run: ./platform/scripts/bootstrap.sh

      # The native build (-n) needs cbindgen/nasm/just on the host, which the
      # podman path would have supplied from the redox-base container.
      - name: Install native build host dependencies
        run: ./platform/scripts/host-deps.sh

      - name: Build aarch64 ai-edge image
        run: ./platform/scripts/build.sh -a aarch64 -c ai-edge -n

      # aarch64 boots to a login prompt and an interactive shell, so
      # `login:` and the guest-side identity marker are hard requirements and a
      # miss is a real regression. Exit 2 means the test could not run at all
      # (no QEMU binary, no UEFI firmware), which is a broken environment and
      # must not be reported as a booting image either.
      #
      # No --gic-v3. It was carried over from when the NVMe hang was still open
      # and it was assumed to help, but it was never verified. With it this
      # image cannot reach the milestones it is meant to check: `ls` and `cat`
      # die with an unhandled exception and a guard-page fault, which is what
      # made this job fail. Reproduced locally; see
      # docs/gotchas/security-isolation.md.
      #
      # LOGIN_DELAY has to cover boot plus the serial login, and TCG on a
      # runner is slower than a workstation. The default in test.sh is 120s,
      # which left the login commands racing the prompt here.
      - name: Run aarch64 boot test
        run: |
          LOGIN_DELAY=200 ./platform/scripts/test.sh -a aarch64 -c ai-edge -t 600

      # The boot canary above cannot see memory corruption: a single `cat`
      # succeeds most of the time even on a broken image. This repeats each
      # command in one boot and requires every repeat to succeed, which is the
      # only way the rate shows up. Known to fail today (8/10 on 2026-09-30) --
      # it is wired in as `continue-on-error` so it reports the real number
      # instead of being quietly omitted, and it becomes a hard gate once
      # aarch64 memory safety is actually fixed. See
      # docs/gotchas/security-isolation.md.
      - name: Run aarch64 stability test (expected to fail)
        continue-on-error: true
        run: |
          LOGIN_DELAY=200 ./platform/scripts/test-stability.sh \
            -c ai-edge -n 10 -t 900

      - name: Upload aarch64 boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-boot-log
          if-no-files-found: warn
          path: /tmp/aios-*.log
